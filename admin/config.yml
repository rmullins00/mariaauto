backend:
  name: git-gateway
  branch: main

media_folder: images
public_folder: images

collections:

  - name: "english"
    label: "English Content"
    files:

      - name: "en_hero"
        label: "Hero Section"
        file: "content/en.json"
        fields:
          - { name: "hero.badge", label: "Badge Text", widget: string, hint: "Small label above the headline (e.g. 'Dade County's Trusted Driving School')" }
          - { name: "hero.sub", label: "Tagline", widget: string, hint: "Italic line below the headline" }
          - { name: "hero.body", label: "Hero Description", widget: text, hint: "Main paragraph in the hero section" }

      - name: "en_services"
        label: "Services Section"
        file: "content/en.json"
        fields:
          - { name: "services.desc", label: "Section Description", widget: text }
          - { name: "services.s2title", label: "Practical Driving Exam — Title", widget: string }
          - { name: "services.s2desc", label: "Practical Driving Exam — Description", widget: text }
          - { name: "services.s3title", label: "Driving Lessons — Title", widget: string }
          - { name: "services.s3desc", label: "Driving Lessons — Description", widget: text }
          - { name: "services.s4title", label: "Alcohol & Drug Course — Title", widget: string }
          - { name: "services.s4desc", label: "Alcohol & Drug Course — Description", widget: text }
          - { name: "services.s5title", label: "Theoretical Exam — Title", widget: string }
          - { name: "services.s5desc", label: "Theoretical Exam — Description", widget: text }

      - name: "en_faq"
        label: "FAQ Section"
        file: "content/en.json"
        fields:
          - { name: "faq.q1", label: "Question 1", widget: string }
          - { name: "faq.a1", label: "Answer 1", widget: text }
          - { name: "faq.q2", label: "Question 2", widget: string }
          - { name: "faq.a2", label: "Answer 2", widget: text }
          - { name: "faq.q3", label: "Question 3", widget: string }
          - { name: "faq.a3", label: "Answer 3", widget: text }
          - { name: "faq.q4", label: "Question 4", widget: string }
          - { name: "faq.a4", label: "Answer 4", widget: text }
          - { name: "faq.q5", label: "Question 5", widget: string }
          - { name: "faq.a5", label: "Answer 5", widget: text }
          - { name: "faq.q6", label: "Question 6", widget: string }
          - { name: "faq.a6", label: "Answer 6", widget: text }
          - { name: "faq.q7", label: "Question 7", widget: string }
          - { name: "faq.a7", label: "Answer 7", widget: text }

      - name: "en_general"
        label: "General / Other Text"
        file: "content/en.json"
        fields:
          - { name: "contact.hoursValue", label: "Business Hours", widget: string, hint: "e.g. Mon–Fri 8am–3pm · Sat 8am–1pm · Sun Closed" }
          - { name: "form.availabilityNote", label: "Booking Availability Note", widget: string, hint: "Short note shown at the top of the booking form" }
          - { name: "contact.body", label: "Contact Section Description", widget: text }
          - { name: "footer.tagline", label: "Footer Tagline", widget: text }
          - { name: "cta.title", label: "Call-to-Action Title", widget: string }
          - { name: "cta.body", label: "Call-to-Action Description", widget: text }
          - { name: "why.body", label: "Why Choose Us — Description", widget: text }
          - { name: "why.f1desc", label: "Why Us — Point 1 Description", widget: string }
          - { name: "why.f2desc", label: "Why Us — Point 2 Description", widget: string }
          - { name: "why.f3desc", label: "Why Us — Point 3 Description", widget: string }

  - name: "spanish"
    label: "Contenido en Español"
    files:

      - name: "es_hero"
        label: "Sección Hero"
        file: "content/es.json"
        fields:
          - { name: "hero.badge", label: "Texto del Badge", widget: string }
          - { name: "hero.sub", label: "Eslogan", widget: string }
          - { name: "hero.body", label: "Descripción Principal", widget: text }

      - name: "es_services"
        label: "Sección de Servicios"
        file: "content/es.json"
        fields:
          - { name: "services.desc", label: "Descripción de la Sección", widget: text }
          - { name: "services.s2title", label: "Examen Práctico — Título", widget: string }
          - { name: "services.s2desc", label: "Examen Práctico — Descripción", widget: text }
          - { name: "services.s3title", label: "Clases de Manejo — Título", widget: string }
          - { name: "services.s3desc", label: "Clases de Manejo — Descripción", widget: text }
          - { name: "services.s4title", label: "Alcohol y Drogas — Título", widget: string }
          - { name: "services.s4desc", label: "Alcohol y Drogas — Descripción", widget: text }
          - { name: "services.s5title", label: "Examen Teórico — Título", widget: string }
          - { name: "services.s5desc", label: "Examen Teórico — Descripción", widget: text }

      - name: "es_faq"
        label: "Preguntas Frecuentes"
        file: "content/es.json"
        fields:
          - { name: "faq.q1", label: "Pregunta 1", widget: string }
          - { name: "faq.a1", label: "Respuesta 1", widget: text }
          - { name: "faq.q2", label: "Pregunta 2", widget: string }
          - { name: "faq.a2", label: "Respuesta 2", widget: text }
          - { name: "faq.q3", label: "Pregunta 3", widget: string }
          - { name: "faq.a3", label: "Respuesta 3", widget: text }
          - { name: "faq.q4", label: "Pregunta 4", widget: string }
          - { name: "faq.a4", label: "Respuesta 4", widget: text }
          - { name: "faq.q5", label: "Pregunta 5", widget: string }
          - { name: "faq.a5", label: "Respuesta 5", widget: text }
          - { name: "faq.q6", label: "Pregunta 6", widget: string }
          - { name: "faq.a6", label: "Respuesta 6", widget: text }
          - { name: "faq.q7", label: "Pregunta 7", widget: string }
          - { name: "faq.a7", label: "Respuesta 7", widget: text }

      - name: "es_general"
        label: "Texto General / Otros"
        file: "content/es.json"
        fields:
          - { name: "contact.hoursValue", label: "Horario de Atención", widget: string }
          - { name: "form.availabilityNote", label: "Nota de Disponibilidad", widget: string }
          - { name: "contact.body", label: "Descripción de Contacto", widget: text }
          - { name: "footer.tagline", label: "Lema del Footer", widget: text }
          - { name: "cta.title", label: "Título del CTA", widget: string }
          - { name: "cta.body", label: "Descripción del CTA", widget: text }
          - { name: "why.body", label: "Por Qué Elegirnos — Descripción", widget: text }
          - { name: "why.f1desc", label: "Por Qué — Punto 1", widget: string }
          - { name: "why.f2desc", label: "Por Qué — Punto 2", widget: string }
          - { name: "why.f3desc", label: "Por Qué — Punto 3", widget: string }
