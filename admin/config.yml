backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:

  - label: "English Content"
    name: "english"
    files:
      - label: "Website Content"
        name: "website"
        file: "content/en.json"
        fields:

          - {label: "Hero — Badge", name: "hero.badge", widget: string}
          - {label: "Hero — Subtitle", name: "hero.sub", widget: string}
          - {label: "Hero — Description", name: "hero.body", widget: text}

          - {label: "Services — Section Description", name: "services.desc", widget: text}
          - {label: "Services — Theoretical Exam Title", name: "services.s5title", widget: string}
          - {label: "Services — Theoretical Exam Description", name: "services.s5desc", widget: text}
          - {label: "Services — Practical Exam Title", name: "services.s2title", widget: string}
          - {label: "Services — Practical Exam Description", name: "services.s2desc", widget: text}
          - {label: "Services — Driving Lessons Title", name: "services.s3title", widget: string}
          - {label: "Services — Driving Lessons Description", name: "services.s3desc", widget: text}
          - {label: "Services — Alcohol Course Title", name: "services.s4title", widget: string}
          - {label: "Services — Alcohol Course Description", name: "services.s4desc", widget: text}
          - {label: "Services — Bilingual Service Title", name: "services.s6title", widget: string}
          - {label: "Services — Bilingual Service Description", name: "services.s6desc", widget: text}

          - {label: "Why Choose Us — Main Description", name: "why.body", widget: text}
          - {label: "Why Choose Us — Point 1", name: "why.f1desc", widget: string}
          - {label: "Why Choose Us — Point 2", name: "why.f2desc", widget: string}
          - {label: "Why Choose Us — Point 3", name: "why.f3desc", widget: string}

          - {label: "Reviews — Subtitle", name: "reviews.sub", widget: text}

          - {label: "FAQ — Question 1", name: "faq.q1", widget: string}
          - {label: "FAQ — Answer 1", name: "faq.a1", widget: text}
          - {label: "FAQ — Question 2", name: "faq.q2", widget: string}
          - {label: "FAQ — Answer 2", name: "faq.a2", widget: text}
          - {label: "FAQ — Question 3", name: "faq.q3", widget: string}
          - {label: "FAQ — Answer 3", name: "faq.a3", widget: text}
          - {label: "FAQ — Question 4", name: "faq.q4", widget: string}
          - {label: "FAQ — Answer 4", name: "faq.a4", widget: text}
          - {label: "FAQ — Question 5", name: "faq.q5", widget: string}
          - {label: "FAQ — Answer 5", name: "faq.a5", widget: text}
          - {label: "FAQ — Question 6", name: "faq.q6", widget: string}
          - {label: "FAQ — Answer 6", name: "faq.a6", widget: text}
          - {label: "FAQ — Question 7", name: "faq.q7", widget: string}
          - {label: "FAQ — Answer 7", name: "faq.a7", widget: text}

          - {label: "Contact — Description", name: "contact.body", widget: text}
          - {label: "Business Hours", name: "contact.hoursValue", widget: string}
          - {label: "Booking Availability Note", name: "form.availabilityNote", widget: string}
          - {label: "Footer Tagline", name: "footer.tagline", widget: text}
          - {label: "CTA Title", name: "cta.title", widget: string}
          - {label: "CTA Description", name: "cta.body", widget: text}

  - label: "Contenido en Español"
    name: "spanish"
    files:
      - label: "Contenido del Sitio"
        name: "website"
        file: "content/es.json"
        fields:

          - {label: "Hero — Badge", name: "hero.badge", widget: string}
          - {label: "Hero — Eslogan", name: "hero.sub", widget: string}
          - {label: "Hero — Descripción", name: "hero.body", widget: text}

          - {label: "Servicios — Descripción", name: "services.desc", widget: text}
          - {label: "Servicios — Examen Teórico Título", name: "services.s5title", widget: string}
          - {label: "Servicios — Examen Teórico Descripción", name: "services.s5desc", widget: text}
          - {label: "Servicios — Examen Práctico Título", name: "services.s2title", widget: string}
          - {label: "Servicios — Examen Práctico Descripción", name: "services.s2desc", widget: text}
          - {label: "Servicios — Clases de Manejo Título", name: "services.s3title", widget: string}
          - {label: "Servicios — Clases de Manejo Descripción", name: "services.s3desc", widget: text}
          - {label: "Servicios — Alcohol y Drogas Título", name: "services.s4title", widget: string}
          - {label: "Servicios — Alcohol y Drogas Descripción", name: "services.s4desc", widget: text}
          - {label: "Servicios — Servicio Bilingüe Título", name: "services.s6title", widget: string}
          - {label: "Servicios — Servicio Bilingüe Descripción", name: "services.s6desc", widget: text}

          - {label: "Por Qué Elegirnos — Descripción", name: "why.body", widget: text}
          - {label: "Por Qué — Punto 1", name: "why.f1desc", widget: string}
          - {label: "Por Qué — Punto 2", name: "why.f2desc", widget: string}
          - {label: "Por Qué — Punto 3", name: "why.f3desc", widget: string}

          - {label: "Reseñas — Subtítulo", name: "reviews.sub", widget: text}

          - {label: "FAQ — Pregunta 1", name: "faq.q1", widget: string}
          - {label: "FAQ — Respuesta 1", name: "faq.a1", widget: text}
          - {label: "FAQ — Pregunta 2", name: "faq.q2", widget: string}
          - {label: "FAQ — Respuesta 2", name: "faq.a2", widget: text}
          - {label: "FAQ — Pregunta 3", name: "faq.q3", widget: string}
          - {label: "FAQ — Respuesta 3", name: "faq.a3", widget: text}
          - {label: "FAQ — Pregunta 4", name: "faq.q4", widget: string}
          - {label: "FAQ — Respuesta 4", name: "faq.a4", widget: text}
          - {label: "FAQ — Pregunta 5", name: "faq.q5", widget: string}
          - {label: "FAQ — Respuesta 5", name: "faq.a5", widget: text}
          - {label: "FAQ — Pregunta 6", name: "faq.q6", widget: string}
          - {label: "FAQ — Respuesta 6", name: "faq.a6", widget: text}
          - {label: "FAQ — Pregunta 7", name: "faq.q7", widget: string}
          - {label: "FAQ — Respuesta 7", name: "faq.a7", widget: text}

          - {label: "Contacto — Descripción", name: "contact.body", widget: text}
          - {label: "Horario", name: "contact.hoursValue", widget: string}
          - {label: "Nota de Disponibilidad", name: "form.availabilityNote", widget: string}
          - {label: "Texto del Footer", name: "footer.tagline", widget: text}
          - {label: "Título del CTA", name: "cta.title", widget: string}
          - {label: "Descripción del CTA", name: "cta.body", widget: text}
